<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎣 Enhanced AI Fishing Buddy</title>
<style>
body { font-family: Arial, sans-serif; background:#e0f7fa; display:flex; justify-content:center; padding:20px; }
#chat-container { max-width:600px; width:100%; }
#chat { border:1px solid #ccc; padding:15px; height:500px; overflow-y:auto; background:#fff; border-radius:8px; }
#userInput { width:65%; padding:8px; margin-top:10px; }
#sendBtn { padding:8px; margin-left:5px; }
.message { margin:10px 0; padding:5px 10px; border-radius:5px; max-width:90%; white-space:pre-line; }
.user { background-color:#d0e7ff; color:#003366; }
.bot { background-color:#fff9c4; color:#665500; }
.quick-btn { padding:5px 10px; margin:2px; cursor:pointer; border-radius:5px; border:none; background:#4CAF50; color:white; }
</style>
</head>
<body>
<div id="chat-container">
  <h2>🎣 Friendly Emoji AI Fishing Buddy</h2>
  <div id="chat"></div>
  <input type="text" id="userInput" placeholder="Ask me about fishing...">
  <button id="sendBtn">Send</button>
  <div id="buttons">
    <button class="quick-btn" data-query="top baits">Top Baits</button>
    <button class="quick-btn" data-query="all fish">All Fish</button>
    <button class="quick-btn" data-query="all lures">All Lures</button>
    <button class="quick-btn" data-query="fishing tips">Fishing Tips</button>
    <button class="quick-btn" data-query="joke">Tell me a fishing joke</button>
  </div>
</div>

<script>
// --- DATASET ---
const fishingData = {
  carp: { bait:["Hot dogs 🍞","Corn 🌽","Bread 🍞","Dough balls 🍞"], depth:"Shallow 🏞️", waterTemp:"65-80°F 🌡️", conditions:"Calm lakes 🌊", season:["Spring 🌱","Summer ☀️","Fall 🍁"], location:["Lake 🏞️","Pond 🏞️"], techniques:["Bottom fishing ⬇️","Float rig 🏞️"], hook:"6-10", line:"6-12 lb", rig:"Hair rig" },
  bass: { bait:["Worms 🪱","Crankbaits 🎣","Soft plastics 🟢","Spinnerbaits 🌀"], depth:"Mid-depth 🌊", waterTemp:"55-75°F 🌡️", conditions:"Lakes 🌊, rivers 🌊", season:["Spring 🌱","Summer ☀️"], location:["Lake 🏞️","River 🌊"], techniques:["Surface feeding 🏞️","Jigging 🎣","Casting 🎣"], hook:"2-6", line:"8-14 lb", rig:"Texas rig" },
  catfish: { bait:["Chicken liver 🍗","Worms 🪱","Shrimp 🍤","Stink bait 💩"], depth:"Bottom ⬇️", waterTemp:"70-85°F 🌡️", conditions:"Rivers 🌊, muddy lakes 🌊", season:["Summer ☀️","Fall 🍁"], location:["River 🌊","Lake 🏞️"], techniques:["Bottom fishing ⬇️","Drift fishing 🛶"], hook:"2-4/0", line:"12-20 lb", rig:"Slip sinker rig" },
  trout: { bait:["PowerBait 💥","Worms 🪱","Insects 🐜"], depth:"Shallow-mid 🏞️🌊", waterTemp:"50-65°F 🌡️", conditions:"Clear rivers 🌊 and lakes 🌊", season:["Spring 🌱","Summer ☀️","Fall 🍁"], location:["River 🌊","Lake 🏞️"], techniques:["Fly fishing 🎣","Spin fishing 🎣"], hook:"8-12", line:"4-8 lb", rig:"Single hook" },
  salmon: { bait:["Salmon eggs 🥚","Shrimp 🍤","Plugs 🎣"], depth:"Mid-depth 🌊", waterTemp:"45-60°F 🌡️", conditions:"Rivers 🌊 and estuaries 🌊", season:["Fall 🍁"], location:["River 🌊","Coastal 🌊"], techniques:["Drift fishing 🛶","Trolling 🚤"], hook:"6-10", line:"8-12 lb", rig:"Egg loop rig" }
  // ...add more fish/lures here
};

// --- SYNONYMS FOR VAGUE INPUTS ---
const synonyms = {
  worms: ["wrigglers","nightcrawlers","wormz"],
  hotdogs: ["hot dog","hotdogs","dog sausage"],
  corn: ["maize"],
  pond: ["small lake","muddy water","stagnant water"],
  lake: ["big lake","open water"],
  river: ["stream","creek","flowing water"],
  something: ["fish","any fish","catch anything","something to catch"],
  big: ["large","huge","monster","giant"]
};

// --- HUMOR & PERSONALITY ---
const jokes = [
  "Why did the fish blush? Because it saw the lake's bottom! 😂",
  "What do you call a fish with no eyes? Fsh! 🐟",
  "Why don't fish play basketball? They're afraid of the net! 🏀",
  "I tried fishing with glue once… I couldn’t let go of my bait! 😆"
];

const personalityPhrases = [
  "No worries buddy! 🎣",
  "You're doing great! 🐟",
  "Patience pays off! 🕰️",
  "Let's catch some fish! 🛶",
  "Looks like a big one is waiting! 😎",
  "The fish are nibbling today! 🐠"
];

// --- SEASONAL TIP ---
function getSeasonalTip() {
  const month = new Date().getMonth() + 1;
  if(month>=3 && month<=5) return "🌱 Spring is perfect! Fish are hungry after winter.";
  if(month>=6 && month<=8) return "☀️ Summer’s hot! Fish bite early morning or late evening.";
  if(month>=9 && month<=11) return "🍁 Fall is great for big bites as fish prep for winter.";
  return "❄️ Winter’s cold! Fish slow down, but it’s peaceful on the water.";
}

// --- MEMORY ---
const conversationMemory = [];

// --- HELPERS ---
function capitalize(str){ return str.charAt(0).toUpperCase() + str.slice(1); }
function addMessage(sender,text){
  const chatDiv=document.getElementById("chat");
  const msgDiv=document.createElement("div");
  msgDiv.classList.add("message",sender);
  msgDiv.textContent=text;
  chatDiv.appendChild(msgDiv);
  chatDiv.scrollTop=chatDiv.scrollHeight;
  conversationMemory.push({role:sender,text:text});
  if(conversationMemory.length>10) conversationMemory.shift();
}

// --- EXPANDED PARSE FUNCTION WITH SYNONYMS & FUZZY MATCH ---
function parseQuery(input){
  input=input.toLowerCase();
  for(let key in synonyms){
    synonyms[key].forEach(syn=>{
      if(input.includes(syn)) input=input.replace(new RegExp(syn,'g'), key);
    });
  }

  const keywords={fish:[],bait:[],depth:[],conditions:[],size:[]};
  for(let fish in fishingData){
    if(input.includes(fish)) keywords.fish.push(fish);
    fishingData[fish].bait.forEach(b=>{
      const plainB=b.replace(/[\u{1F300}-\u{1F6FF}]/gu,'').toLowerCase();
      if(input.includes(plainB)) keywords.bait.push(b);
    });
    if(input.includes("shallow")) keywords.depth.push("Shallow");
    if(input.includes("mid")) keywords.depth.push("Mid-depth");
    if(input.includes("bottom")) keywords.depth.push("Bottom");
    if(input.includes("lake")) keywords.conditions.push("Lake");
    if(input.includes("pond")) keywords.conditions.push("Pond");
    if(input.includes("river")) keywords.conditions.push("River");
    if(input.includes("big")||input.includes("large")||input.includes("huge")) keywords.size.push("big");
  }
  return keywords;
}

function findBestMatch(keywords){
  let best=null, score=0;
  for(let fish in fishingData){
    let s=0;
    if(keywords.fish.includes(fish)) s+=3;
    if(fishingData[fish].bait.some(b=>keywords.bait.includes(b))) s+=2;
    if(keywords.depth.includes(fishingData[fish].depth.replace(/[\u{1F300}-\u{1F6FF}]/gu,''))) s+=1;
    if(keywords.conditions.some(c=>fishingData[fish].location.includes(c))) s+=1;
    if(keywords.size.includes("big") && ["pike","muskie","salmon"].includes(fish)) s+=2;
    if(s>score){score=s; best=fish;}
  }
  return best;
}

function getLastFish(){
  for(let i=conversationMemory.length-1;i>=0;i--){
    if(conversationMemory[i].role==="bot"){
      for(let fish in fishingData){
        if(conversationMemory[i].text.toLowerCase().includes(fish)) return fish;
      }
    }
  }
  return null;
}

// --- RESPONSE ---
function generateResponse(input){
  const elabKeywords=["tell me more","explain","why","elaborate"];
  const wantsElab=elabKeywords.some(w=>input.toLowerCase().includes(w));
  const personality=personalityPhrases[Math.floor(Math.random()*personalityPhrases.length)];

  if(input.toLowerCase().includes("joke")) return jokes[Math.floor(Math.random()*jokes.length)] + " " + personality + " " + getSeasonalTip();
  if(input.toLowerCase().includes("top baits")) return "🎯 Top baits today: " + Object.keys(fishingData).join(", ") + ". " + personality + " " + getSeasonalTip();
  if(input.toLowerCase().includes("all fish")) return "🐟 Fish you can catch: " + Object.keys(fishingData).join(", ") + ". " + personality + " " + getSeasonalTip();
  if(input.toLowerCase().includes("fishing tips")) return "💡 Pro tip: Match bait size to fish size, fish early morning or late evening, and enjoy the outdoors! " + personality + " " + getSeasonalTip();

  const keywords=parseQuery(input);
  let fish=findBestMatch(keywords);
  if(!fish) fish=getLastFish(); 
  if(fish){
    const info=fishingData[fish];
    let response=`${personality} ${capitalize(fish)} 🐟 usually bite on ${info.bait.join(", ")}. Try ${info.techniques.join(", ")} at ${info.depth} when water is around ${info.waterTemp}.`;
    if(wantsElab) response+=`\n\nExtra tip: Use hook ${info.hook}, line ${info.line}, rig ${info.rig}. Sometimes patience and a little luck pays off! 🎣`;
    response+=" " + getSeasonalTip();
    return response;
  }

  // fallback for vague inputs
  return `${personality} Hmm… Based on what I can tell, bass 🐟, carp 🐟, or bluegill 🐟 are great choices. Try worms 🪱, corn 🌽, or hot dogs 🍞 in shallow or mid-depth waters 🏞️🌊. ` + getSeasonalTip();
}

// --- QUICK BUTTONS ---
document.querySelectorAll('.quick-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.getElementById('userInput').value=btn.dataset.query;
    document.getElementById('sendBtn').click();
  });
});

// --- SEND ---
document.getElementById("sendBtn").addEventListener("click",()=>{
  const inputField=document.getElementById("userInput");
  const userText=inputField.value.trim();
  if(userText==="") return;
  addMessage("user","You: "+userText);
  const botResponse=generateResponse(userText);
  addMessage("bot","Buddy: "+botResponse);
  inputField.value="";
  inputField.focus();
});

// --- ENTER KEY ---
document.getElementById("userInput").addEventListener("keypress",(e)=>{
  if(e.key==="Enter") document.getElementById("sendBtn").click();
});
</script>
</body>
</html>
