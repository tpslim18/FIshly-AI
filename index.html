<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fishly-AI 🎣</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f8ff; padding: 20px; }
    h1 { text-align: center; }
    #chat-container { max-width: 600px; margin: auto; }
    #chat-window { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 10px; background: #fff; }
    .user-message { background: #d1e7dd; padding: 6px; margin: 4px; border-radius: 5px; }
    .bot-message { background: #f8d7da; padding: 6px; margin: 4px; border-radius: 5px; }
    #user-input { width: 75%; }
    button { padding: 6px 10px; margin-left: 5px; cursor: pointer; }
    #tools { margin-top: 20px; text-align: center; }
    .tool-box { border: 1px solid #aaa; padding: 15px; margin: 10px auto; width: 90%; border-radius: 8px; background: #fff; }
  </style>
</head>
<body>
  <h1>🐟 Fishly-AI 🎣</h1>

  <!-- Chat Section -->
  <div id="chat-container">
    <h2>Chat</h2>
    <div id="chat-window">
      <div class="bot-message">Hi, I am Fishly-AI 🐟 how can I help today?</div>
    </div>
    <div style="margin-top:10px;">
      <input type="text" id="user-input" placeholder="Type your fishing question...">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <!-- Tools -->
  <div id="tools">
    <h2>Fishing Tools</h2>

    <!-- Casting Analysis -->
    <div class="tool-box">
      <h3>Casting Analysis 🎯</h3>
      <input type="file" id="casting-upload" accept="image/*">
      <button onclick="analyzeCasting()">Analyze Casting Spot</button>
      <div id="casting-result"></div>
    </div>

    <!-- Fish Identifier -->
    <div class="tool-box">
      <h3>Fish Identifier 🐠</h3>
      <input type="file" id="fish-upload" accept="image/*">
      <button onclick="identifyFish()">Identify Fish</button>
      <div id="fish-result"></div>
    </div>
  </div>

<script>
// === CHATBOT (Local GPT) ===
async function sendMessage() {
  const inputField = document.getElementById("user-input");
  const message = inputField.value.trim();
  if (!message) return;

  const chatWindow = document.getElementById("chat-window");

  const userMsgDiv = document.createElement("div");
  userMsgDiv.className = "user-message";
  userMsgDiv.textContent = "You: " + message;
  chatWindow.appendChild(userMsgDiv);
  chatWindow.scrollTop = chatWindow.scrollHeight;

  inputField.value = "";

  try {
    const response = await fetch("http://localhost:5000/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "local-gpt",
        messages: [
          {
            role: "system",
            content: "You are Fishly-AI, a friendly fishing assistant. Always begin conversations with 'Hi, I am Fishly-AI 🐟 how can I help today?' if it's the first message. Keep all conversations about fishing, bait, casting, and related topics. If the user goes off-topic, gently steer them back to fishing."
          },
          { role: "user", content: message }
        ]
      })
    });

    const data = await response.json();
    const botReply = data.choices[0].message.content;

    const botMsgDiv = document.createElement("div");
    botMsgDiv.className = "bot-message";
    botMsgDiv.textContent = "Fishly-AI: " + botReply;
    chatWindow.appendChild(botMsgDiv);
    chatWindow.scrollTop = chatWindow.scrollHeight;
  } catch (err) {
    const errorDiv = document.createElement("div");
    errorDiv.className = "bot-message";
    errorDiv.textContent = "Fishly-AI: ⚠️ Error talking to local GPT.";
    chatWindow.appendChild(errorDiv);
  }
}

// === CASTING ANALYSIS ===
async function analyzeCasting() {
  const fileInput = document.getElementById("casting-upload");
  const file = fileInput.files[0];
  if (!file) {
    alert("Please upload a water photo first.");
    return;
  }

  const reader = new FileReader();
  reader.onloadend = async () => {
    document.getElementById("casting-result").innerHTML = "Analyzing casting spot... 🎯";

    try {
      // Send image to GPT (if multimodal support) or placeholder
      const response = await fetch("http://localhost:5000/v1/images/analyze", {
        method: "POST",
        body: JSON.stringify({ image: reader.result, task: "find_best_casting_spot" }),
        headers: { "Content-Type": "application/json" }
      });

      const result = await response.json();
      document.getElementById("casting-result").innerHTML = "Best casting spot marked ✅ (circle overlay in processed image)";
    } catch {
      document.getElementById("casting-result").innerHTML = "⚠️ Casting analysis not available locally.";
    }
  };
  reader.readAsDataURL(file);
}

// === FISH IDENTIFIER ===
async function identifyFish() {
  const fileInput = document.getElementById("fish-upload");
  const file = fileInput.files[0];
  if (!file) {
    alert("Please upload a fish photo first.");
    return;
  }

  const reader = new FileReader();
  reader.onloadend = async () => {
    document.getElementById("fish-result").innerHTML = "Identifying fish... 🐠";

    try {
      // Send image to GPT (if multimodal support) or placeholder
      const response = await fetch("http://localhost:5000/v1/images/analyze", {
        method: "POST",
        body: JSON.stringify({ image: reader.result, task: "identify_fish_species" }),
        headers: { "Content-Type": "application/json" }
      });

      const result = await response.json();
      document.getElementById("fish-result").innerHTML = "Identified: " + result.species;
    } catch {
      document.getElementById("fish-result").innerHTML = "⚠️ Fish identification not available locally.";
    }
  };
  reader.readAsDataURL(file);
}
</script>
</body>
</html>
